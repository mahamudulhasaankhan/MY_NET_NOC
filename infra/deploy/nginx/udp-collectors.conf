# Nginx UDP stream proxies: routers keep sending to the classic collector
# ports (514 syslog / 2055 netflow / 6343 sflow); nginx forwards each
# datagram to a healthy engine instance (each instance binds its own unique
# port from /etc/nms/instances/*.env). If one instance dies, the next
# datagram goes to a live one - no data loss, no router config change.

upstream syslog_backends {
    server 127.0.0.1:1514 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:1515 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:1516 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:1517 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:1518 max_fails=1 fail_timeout=5s;
}

server {
    listen 514 udp;
    proxy_pass syslog_backends;
    proxy_responses 0;
    proxy_timeout 2s;
}

upstream netflow_backends {
    server 127.0.0.1:2155 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:2156 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:2157 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:2158 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:2159 max_fails=1 fail_timeout=5s;
}

server {
    listen 2055 udp;
    proxy_pass netflow_backends;
    proxy_responses 0;
    proxy_timeout 2s;
}

upstream sflow_backends {
    server 127.0.0.1:26343 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:26344 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:26345 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:26346 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:26347 max_fails=1 fail_timeout=5s;
}

server {
    listen 6343 udp;
    proxy_pass sflow_backends;
    proxy_responses 0;
    proxy_timeout 2s;
}
