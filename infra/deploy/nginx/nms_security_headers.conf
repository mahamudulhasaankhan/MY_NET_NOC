# ══════════════════════════════════════════════════════════════════════════
# MY_NET — shared security headers (include once per add_header level)
#
# WHY AN INCLUDE: nginx inherits `add_header` from a parent level ONLY when
# the current level defines none. The SPA locations below set Cache-Control,
# which used to silently drop every security header — including the CSP on
# the login page, i.e. exactly where it matters. Including this file at the
# server level AND inside those locations keeps one source of truth.
#
# Deployed by infra/deploy/scripts/apply_nginx.sh to
# /etc/nginx/nms_security_headers.conf
# ══════════════════════════════════════════════════════════════════════════

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP notes (keep this list in sync with frontend/index.html + TurnstileBox):
#   'unsafe-inline'      → index.html ships an inline bootstrap <script> and an
#                          onload= attribute on the font <link> (both need it)
#   challenges.cloudflare.com (script/frame/connect/img)
#                        → Cloudflare Turnstile widget. The anti-bot CAPTCHA
#                          rung is served on suspicious IPs; blocking it here
#                          would fail the login flow closed for those clients.
#   fonts.googleapis.com / fonts.gstatic.com
#                        → Inter webfont loaded by index.html
#   https://*.sentry.io  → only contacted when a Sentry DSN is configured
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://challenges.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.sentry.io https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
