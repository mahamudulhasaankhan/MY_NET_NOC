# MY_NET NOC — Nginx WAF (Web Application Firewall) Rules
#
# Usage:
#   Include in the main nginx server block:
#     include /etc/nginx/waf-rules.conf;
#
# Requires nginx compiled with ModSecurity (libmodsecurity3).
# If ModSecurity is not available, the rate-limit and header
# rules still provide meaningful protection.

# ── Geo Subnet Whitelisting ───────────────────────────────────────────────────
geo $noc_allowed {
    default         1;
    127.0.0.1/32    1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
}

# ── Rate Limiting ────────────────────────────────────────────────────────────
# Global:  60 req/min per IP (matches the slowapi rate limit)
limit_req_zone $binary_remote_addr zone=api_global:10m rate=60r/m;

# Login:   5 req/min per IP (OWASP recommendation)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Bulk/Ping: 30 req/min per IP (heavy operations)
limit_req_zone $binary_remote_addr zone=bulk_limit:10m rate=30r/m;

# ── Request body size limits ─────────────────────────────────────────────────
# Already set in the server block: client_max_body_size 100M

# ── ModSecurity (if module is loaded) ────────────────────────────────────────
# Uncomment these lines after compiling nginx with --with-modsecurity:
#
# modsecurity on;
# modsecurity_rules_file /etc/nginx/modsecurity-rules.conf;

# ── Header-based attack filtering ────────────────────────────────────────────

# Block requests with suspicious User-Agent strings
map $http_user_agent $bad_bot {
    default         0;
    ~*(curl|wget|nikto|sqlmap|nmap|masscan|zgrab|hydra|medusa) 1;
    ~*(python-requests|python-urllib|go-http-client|Java/)      1;
}

# Block requests with common attack patterns in URI.
# NOTE: matched against $uri (normalized + percent-decoded), NOT
# $request_uri — raw matching let /etc%2Fpasswd slip past the filter.
map $uri $attack_uri {
    default          0;
    ~*(/etc/passwd)                           1;
    ~*(/proc/self/environ)                    1;
    ~*(/bin/sh|/bin/bash|/bin/cmd)            1;
    "~*(/webdav|/cgi-bin|/wp-admin|/joomla)"    1;
    "~*(\$\{|__proto__|constructor\.)"          1;
    "~*(union.*select.*from|select.*from.*where)" 1;
    ~*(/\.git/config)                         1;
    ~*(/env\b|/.env\b)                        1;
}

# Block SQL injection patterns in query args
map $args $sqli_attack {
    default       0;
    "~*(union.*select|select.*from|insert\s+into|delete\s+from|drop\s+table)" 1;
    "~*((--|#|\bOR\b|\bAND\b).*\d|'.*='.*')"                                  1;
    "~*(exec\s*\(|execute\s*\()"                                               1;
}

# ── Apply the maps ───────────────────────────────────────────────────────────
# These deny rules must be placed INSIDE the server block,
# before the main location / block.
#
# Example:
#   if ($bad_bot)           { return 403; }
#   if ($attack_uri)        { return 403; }
#   if ($sqli_attack)       { return 403; }
#   if ($spoofed_browser_bot) { return 403; }
#   limit_req zone=api_global burst=20 nodelay;

# ── Browser-Spoofing Detection (Tier 2) ─────────────────────────────────────
# A UA header is client-supplied free text — matching it alone proves nothing.
# These maps are a COST FILTER, not identity proof: traffic that evades them
# is deliberately passed to the deeper layers (PoW challenge, fail2ban,
# account lockout) rather than trusted.
#
# 1) UA claims to be a modern browser...
map $http_user_agent $claims_browser {
    default 0;
    "~*(Chrome/|Firefox/|Safari/|Edg/)" 1;
}

# 2) ...but sends none of the headers a real browser always sends.
#    All-three-absent ("::") => almost certainly a scripted client.
#    (All-three-or-nothing keeps iOS Safari / older engines safe.)
map "$http_sec_ch_ua:$http_sec_fetch_mode:$http_sec_fetch_site" $has_browser_sec_headers {
    default 1;
    "::"    0;
}

# 3) Deployment healthcheck UA is explicitly allowed through.
#    NOTE: no Authorization-based exemption — an attacker sending
#    "Authorization: Bearer garbage" would otherwise bypass the check.
map "$http_user_agent" $healthcheck_exempt {
    default 0;
    "~nms-deploy-healthcheck" 1;
}

# 4) Composite: claims Chrome, no browser headers, not a healthcheck.
map "$claims_browser:$has_browser_sec_headers:$healthcheck_exempt" $spoofed_browser_bot {
    default 0;
    "1:0:0" 1;
}
