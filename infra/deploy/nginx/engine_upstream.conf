# Web API Cluster Upstream — 5 dedicated api-only instances (no polling)
upstream nms_engine_upstream {
    least_conn;
    keepalive 64;
    server 127.0.0.1:8000 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8001 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8002 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8003 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8004 max_fails=2 fail_timeout=5s;
}

# Polling Worker Cluster Metrics Upstream — 3 leader-elected poller instances
# NOTE: These ports are NOT exposed to users. Only used for internal
# Prometheus /metrics scraping by VictoriaMetrics.
upstream nms_poller_metrics {
    server 127.0.0.1:9000 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:9001 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:9002 max_fails=3 fail_timeout=15s;
}
