events {
    worker_connections 1024;
}

stream {
    # Re-resolve every 10s so RADIUS containers can be recreated (new IPs)
    # without ever hand-restarting the balancer. `resolve` requires a zone.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream radius_auth {
        zone radius_auth 64k;
        server freeradius:1812 resolve max_fails=1 fail_timeout=3s;
        server freeradius-2:1812 resolve max_fails=1 fail_timeout=3s;
    }

    upstream radius_acct {
        zone radius_acct 64k;
        server freeradius:1813 resolve max_fails=1 fail_timeout=3s;
        server freeradius-2:1813 resolve max_fails=1 fail_timeout=3s;
    }

    server {
        listen 1812 udp;
        proxy_pass radius_auth;
    }

    server {
        listen 1813 udp;
        proxy_pass radius_acct;
    }
}
