# MY_NET NOC — FastNetMon Community configuration (PLAN_013 re-integration)
# Ingestion: NetFlow :2056/udp + sFlow :6344/udp (host network).
# NOTE: nginx already owns 2055/6343 for the NMS engine's flow pipeline —
# routers send a SECOND flow target to 2056/6344 for FastNetMon detection.

# ── ingestion ──
netflow = on
netflow_port = 2056
sflow = on
sflow_port = 6344
pcap = off

# ── protected networks ──
networks_list_path = /etc/networks_list

# ── detection thresholds (per host/subnet; tune per uplink) ──
ban_for_pps = on
ban_for_bandwidth = on
ban_for_flows = off
threshold_pps = 20000
threshold_mbps = 1000
threshold_flows = 3500
enable_ban = on
ban_time = 1800
ban_details_records_count = 500

# ── callback: Telegram alert + NMS automatic blackhole trigger ──
notify_script_path = /usr/local/bin/notify_about_attack.sh
# The script sources /etc/nms/nms.env (mounted read-only) for the Telegram
# credentials and the NMS trigger secret.

# ── mail disabled (no MTA in the container) ──
exim_path = /bin/false

# ── BGP blackholing stays OFF: the NMS engine performs blackholing through
#    the MikroTik RouterOS API (Security Center) with full audit. Enable the
#    exabgp integration only if you later want FastNetMon to announce /32s
#    itself — it bypasses the NMS audit trail.
bgp = off
bgp_ip = 127.0.0.1
bgp_port = 179
bgp_peer_asn = 65001
bgp_local_asn = 65001

# ── foreground for docker (logs to container stdout) ──
daemonize = off
