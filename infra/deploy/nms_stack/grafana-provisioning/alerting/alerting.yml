apiVersion: 1

contactPoints:
  - orgId: 1
    name: webhook-main
    receivers:
      - uid: webhook-main-r1
        type: webhook
        settings:
          url: http://host.docker.internal:8098/
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: webhook-main
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
