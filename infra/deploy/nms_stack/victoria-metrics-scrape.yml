---
scrape_configs:
  - job_name: node_exporter
    scrape_interval: 30s
    static_configs:
      - targets:
          - node_exporter:9100

  - job_name: nms_engine
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:18080
        labels:
          instance: engine-8000
      - targets:
          - host.docker.internal:18081
        labels:
          instance: engine-8001
      - targets:
          - host.docker.internal:18082
        labels:
          instance: engine-8002
      - targets:
          - host.docker.internal:18083
        labels:
          instance: engine-8003
      - targets:
          - host.docker.internal:18084
        labels:
          instance: engine-8004

  - job_name: redis_exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          - redis_exporter:9121

  - job_name: postgres_exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          - pg-exporter:9187
