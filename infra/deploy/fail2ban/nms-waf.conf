# MY_NET NOC — Fail2ban WAF jails (deployed to /etc/fail2ban/jail.d/nms-waf.conf)
# Administrator safety: these IPs are NEVER banned, even on repeated
# password mistakes.
[DEFAULT]
ignoreip = 127.0.0.1/8 ::1 10.10.10.1 10.10.10.10

# 1. Basic-auth brute force on the admin tooling ports
#    (nginx-http-auth ships with fail2ban; matches error.log auth failures)
[nms-waf-auth]
enabled  = true
port     = http,https,8080,8081,8082,8083,3010,8448
filter   = nginx-http-auth
logpath  = /var/log/nginx/error.log
maxretry = 3
findtime = 300
bantime  = 86400

# 2. Nginx rate-limit violations (login brute-force / API flooding).
#    "limiting requests, excess:" lines in error.log
[nms-waf-limit-req]
enabled  = true
port     = http,https,8080,8081,8082,8083,3010,8448
filter   = nginx-limit-req
logpath  = /var/log/nginx/error.log
maxretry = 3
findtime = 300
bantime  = 86400

# 3. Exploit path scans (/etc/passwd, .env, .git, injection signatures).
#    Catches "access forbidden by rule, client:" lines produced by the
#    WAF return-403 rules in nms_proxy.
[nms-waf-botsearch]
enabled  = true
port     = http,https,8080,8081,8082,8083,3010,8448
filter   = nginx-botsearch
logpath  = /var/log/nginx/error.log
maxretry = 2
findtime = 600
bantime  = 86400