# DB access-path HA front door — haproxy (PLAN_022).
# Replaces the nginx stream proxy (kept as pgpool-proxy.conf.nginx for
# rollback).
#
# pg-pgpool   = pooler-1, the only instance allowed to promote a standby.
# pg-pgpool-2 = passive standby pooler, used only while pooler-1 is DOWN.
#
# Why haproxy: the nginx proxy only marked a peer dead on TCP CONNECT
# failure. A WEDGED pgpool (accepts connections, answers NOTHING) passed
# that test, so every query stalled for minutes behind it — the 2026-10-14
# "login stuck at Loading…" outage. `option pgsql-check` sends a real
# PostgreSQL startup packet every 3s; 3 consecutive silences (≈9s) mark the
# server DOWN and clients fail over to the standby automatically.
#
# Docker's embedded DNS is re-resolved every 10s via the resolvers section,
# so a pooler restart/recreate (new container IP) is picked up with no
# reload, exactly like before.

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    # Long-lived pooled PostgreSQL connections must not be cut off
    # (engines hold idle conns up to 15m; mirrors nginx proxy_timeout 1h).
    timeout connect 3s
    timeout client  1h
    timeout server  1h
    retries 2

resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

frontend db_fe
    bind *:5432
    default_backend db_be

backend db_be
    # Protocol-level probe: any PG response (including an auth request)
    # counts as UP; silence counts as DOWN after fall 3 (inter 3s ≈ 9s).
    option pgsql-check user rnd_user
    default-server inter 3s fall 3 rise 2
    server pgpool1 pg-pgpool:5432   resolvers docker_dns init-addr last,libc,none check inter 3s fall 3 rise 2
    server pgpool2 pg-pgpool-2:5432 resolvers docker_dns init-addr last,libc,none check backup inter 3s fall 3 rise 2
